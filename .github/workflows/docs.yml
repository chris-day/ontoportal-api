name: Build and publish documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Create the repository environment
        run: python -m venv .venv
      - name: Install locked dependencies
        run: |
          .venv/bin/python -m pip install -r requirements-docs.txt -r requirements-docs-browser.txt -r requirements-dev.txt
          .venv/bin/python -m pip install -e '.[dev]'
          .venv/bin/python -m pip check
          .venv/bin/python -m playwright install chromium
      - name: Build and verify documentation
        run: |
          .venv/bin/zensical build --clean --strict
          .venv/bin/python scripts/check_docs.py
          .venv/bin/python scripts/check_docs_browser.py
          .venv/bin/python -m pytest -q
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
